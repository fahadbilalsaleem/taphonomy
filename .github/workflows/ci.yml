name: CI

on:
  push:
    branches: [main, 'factory/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Fixtures, lint and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install the fixture tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes fdisk gdisk dosfstools mtools xz-utils

      - name: Record the fixture tool versions
        run: dpkg-query -W fdisk gdisk dosfstools mtools util-linux

      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install
          rustc --version
          cargo --version

      - name: Generate the fixtures
        run: ./scripts/generate-fixtures.sh

      - name: Check the fixtures match the committed digests
        run: git diff --exit-code -- fixtures/partition/MANIFEST.sha256

      - name: Check the fixtures are deterministic
        run: ./scripts/verify-fixtures.sh

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Documentation
        run: cargo doc --workspace --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Test
        run: cargo test --workspace --no-fail-fast

  fuzz-replay:
    name: Fuzz targets replay their seeds
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install the fixture tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes fdisk gdisk dosfstools mtools xz-utils

      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install
          rustc --version
          cargo --version

      - name: Generate the fixtures
        run: ./scripts/generate-fixtures.sh

      # Plain cargo, no cargo-fuzz and no nightly. The two --config flags
      # keep the overflow and debug assertions the fuzz builds have.
      - name: Build the fuzz targets
        run: >
          cargo build --release --locked --manifest-path fuzz/Cargo.toml
          --config profile.release.debug-assertions=true
          --config profile.release.overflow-checks=true

      - name: Make the seeds
        run: ./scripts/fuzz-seeds.sh fixtures/partition seeds

      # Every input is its own file argument: given a directory with
      # -runs=0 and no -max_len, libFuzzer cuts each input to 4 bytes and
      # the replay passes without testing anything. A crash exits non-zero.
      - name: Replay the seeds and the regression inputs
        run: |
          for target in analyse_image exfat_reader; do
            ./fuzz/target/release/"$target" seeds/*.seed fuzz/regressions/*.seed
          done
